# Lisan'ı GitHub Pages'e yükler: https://duman275.github.io/Lisan/
# Sunucusuz (statik) sürüm: ücretsiz ders motoru tarayıcıda çalışır, telifsiz kitaplar derlemede indirilir.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Telifsiz kitapları önbellekten al
        uses: actions/cache@v4
        with:
          path: public/books
          key: books-${{ hashFiles('src/data/catalog.ts', 'scripts/fetch-tr-books.mjs') }}
          restore-keys: books-
      - name: Telifsiz kitapları indir (Project Gutenberg)
        run: node scripts/fetch-books.mjs
        timeout-minutes: 6
        continue-on-error: true
      - name: Türkçe tam kitapları indir (Vikikaynak)
        run: node scripts/fetch-tr-books.mjs
        timeout-minutes: 8
        continue-on-error: true
      - name: Ücretsiz veriyi siteye kopyala
        run: mkdir -p public/data && cp data/*.gz public/data/
      - name: Derle
        run: npx tsc -p . && npx vite build
        env:
          VITE_STATIC: "1"
          VITE_BASE: /Lisan/
      # Pages'in bir kez açılması gerekir: Settings → Pages → Source: GitHub Actions
      # Android uygulaması (APK): siteyle birlikte indirilebilir → /Lisan/Lisan.apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Android APK derle
        continue-on-error: true
        timeout-minutes: 12
        working-directory: android
        run: gradle assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk ../dist/Lisan.apk && ls -la ../dist/Lisan.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
