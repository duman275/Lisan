    <path d="M-16 -46 L0 -30 L16 -46 M-16 46 L0 30 L16 46" fill="none"/>
  </g>
  <!-- alev (ateş) -->
  <path transform="translate(362 368) scale(1.3)" d="M0 -84 C 30 -40 58 -18 48 22 C 40 56 14 70 0 70 C -14 70 -44 58 -50 24 C -56 -8 -30 -26 -24 -54 C -6 -36 -4 -20 2 -6 C 10 -30 8 -56 0 -84 Z" fill="#ffe08a" opacity="0.95"/>
