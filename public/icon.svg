    <path d="M256 22 L268 52 L266 360 L246 360 L244 52 Z" fill="url(#gold)" stroke="#3a2608" stroke-width="4"/>
    <line x1="256" y1="60" x2="256" y2="350" stroke="#fff6d0" stroke-width="3" opacity="0.8"/>
    <rect x="196" y="356" width="120" height="22" rx="11" fill="url(#gold)" stroke="#3a2608" stroke-width="4"/>
    <rect x="248" y="378" width="16" height="64" rx="6" fill="#4a2e0c" stroke="#2a1a06" stroke-width="3"/>
