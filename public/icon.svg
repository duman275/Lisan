<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/><stop offset="0.45" stop-color="#7cc4f2"/><stop offset="1" stop-color="#16406e"/>
    </linearGradient>
    <linearGradient id="fire" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a0f0f"/><stop offset="0.5" stop-color="#e2531f"/><stop offset="1" stop-color="#ffc35a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset="0.5" stop-color="#e6b54a"/><stop offset="1" stop-color="#a87418"/>
    </linearGradient>
    <clipPath id="iceSide"><polygon points="0,0 512,0 0,512"/></clipPath>
    <clipPath id="fireSide"><polygon points="512,0 512,512 0,512"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0f16"/>
  <g clip-path="url(#iceSide)"><rect width="512" height="512" rx="112" fill="url(#ice)"/></g>
  <g clip-path="url(#fireSide)"><rect width="512" height="512" rx="112" fill="url(#fire)"/></g>
  <!-- kar tanesi (buz) -->
