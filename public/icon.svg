<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Valyria çeliği: dumanlı, dalgalı desen -->
    <filter id="valyrianIce" x="-20%" y="-5%" width="140%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.14 0.018" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.86  0 0 0 0 0.95  2.6 0 0 0 -1.05" result="ripple"/>
      <feComposite in="ripple" in2="SourceGraphic" operator="in" result="r2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="r2"/></feMerge>
    </filter>
    <filter id="valyrianBlack" x="-20%" y="-5%" width="140%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.14 0.018" numOctaves="3" seed="21" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.30  0 0 0 0 0.30  2.6 0 0 0 -1.1" result="ripple"/>
      <feComposite in="ripple" in2="SourceGraphic" operator="in" result="r2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="r2"/></feMerge>
    </filter>
    <filter id="glowIce" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glowFire" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <radialGradient id="bgIce" cx="0.12" cy="0.1" r="0.8"><stop offset="0" stop-color="#8fd0ff"/><stop offset="0.4" stop-color="#1d4a75" stop-opacity="0.95"/><stop offset="1" stop-color="#070a10" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgFire" cx="0.9" cy="0.95" r="0.85"><stop offset="0" stop-color="#ffb04a"/><stop offset="0.38" stop-color="#b5370d" stop-opacity="0.95"/><stop offset="1" stop-color="#070a10" stop-opacity="0"/></radialGradient>
    <linearGradient id="bladeIce" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c232c"/><stop offset="0.47" stop-color="#4c5868"/><stop offset="0.53" stop-color="#2e3743"/><stop offset="1" stop-color="#141a21"/></linearGradient>
    <linearGradient id="bladeBlack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#060607"/><stop offset="0.47" stop-color="#232022"/><stop offset="0.53" stop-color="#121113"/><stop offset="1" stop-color="#030304"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="0.5" stop-color="#a9b6c6"/><stop offset="1" stop-color="#5b6675"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset="0.5" stop-color="#e0a93a"/><stop offset="1" stop-color="#8a5a12"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1a10"/><stop offset="0.5" stop-color="#5a3a22"/><stop offset="1" stop-color="#2a1a10"/></linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>

    <!-- Kılıç şablonları (dikey, sap aşağıda, merkez 0,0) -->
    <!-- Buz: geniş, uzun iki elli kılıç -->
    <g id="ice">
      <path d="M-22 120 L-24 -170 L0 -228 L24 -170 L22 120 Z" fill="url(#bladeIce)" filter="url(#valyrianIce)"/>
      <path d="M-3 110 L-3 -175 L0 -190 L3 -175 L3 110 Z" fill="#1a2028" opacity="0.7"/>
      <path d="M-22 120 L-24 -170 L0 -228 L24 -170 L22 120" fill="none" stroke="#a9dcff" stroke-width="2.5" opacity="0.9"/>
      <path d="M-68 118 Q0 132 68 118 L64 136 Q0 148 -64 136 Z" fill="url(#silver)" stroke="#2a313b" stroke-width="3"/>
      <rect x="-9" y="138" width="18" height="74" rx="5" fill="url(#leather)" stroke="#1a110a" stroke-width="2"/>
      <path d="M-9 150 L9 158 M-9 166 L9 174 M-9 182 L9 190 M-9 198 L9 206" stroke="#7a5535" stroke-width="2"/>
      <circle cx="0" cy="224" r="15" fill="url(#silver)" stroke="#2a313b" stroke-width="3"/>
      <circle cx="0" cy="224" r="6" fill="#7fd3ff"/>
      <circle cx="0" cy="127" r="7" fill="#7fd3ff" stroke="#2a313b" stroke-width="2"/>
    </g>
    <!-- Blackfyre: kara çelik, altın kabza, yakut -->
    <g id="blackfyre">
      <path d="M-17 120 L-19 -175 L0 -222 L19 -175 L17 120 Z" fill="url(#bladeBlack)" filter="url(#valyrianBlack)"/>
      <path d="M-2.5 110 L-2.5 -180 L0 -192 L2.5 -180 L2.5 110 Z" fill="#000" opacity="0.6"/>
      <path d="M-17 120 L-19 -175 L0 -222 L19 -175 L17 120" fill="none" stroke="#ff8a3d" stroke-width="2.5" opacity="0.85"/>
      <path d="M-60 116 Q-30 108 0 122 Q30 108 60 116 L66 106 L70 124 Q30 128 0 142 Q-30 128 -70 124 L-66 106 Z" fill="url(#gold)" stroke="#3a2608" stroke-width="3"/>
      <rect x="-8" y="140" width="16" height="70" rx="5" fill="#1a0f0c" stroke="#3a2608" stroke-width="2"/>
      <path d="M-8 150 L8 160 M-8 168 L8 178 M-8 186 L8 196" stroke="url(#gold)" stroke-width="2.5"/>
      <path d="M0 210 L14 226 L0 242 L-14 226 Z" fill="url(#gold)" stroke="#3a2608" stroke-width="3"/>
      <circle cx="0" cy="226" r="5.5" fill="#d1141e"/>
      <circle cx="0" cy="127" r="7" fill="#d1141e" stroke="#3a2608" stroke-width="2"/>
    </g>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#070a10"/>
    <rect width="512" height="512" fill="url(#bgIce)"/>
    <rect width="512" height="512" fill="url(#bgFire)"/>
    <g fill="#eaf6ff" opacity="0.9"><circle cx="58" cy="210" r="3.5"/><circle cx="112" cy="62" r="3"/><circle cx="190" cy="34" r="2.5"/><circle cx="34" cy="120" r="3"/><circle cx="92" cy="292" r="2.5"/><circle cx="158" cy="118" r="2"/><circle cx="236" cy="70" r="2"/><circle cx="30" cy="330" r="2.5"/></g>
    <g fill="#ffd27a" opacity="0.95"><circle cx="452" cy="312" r="3.5"/><circle cx="476" cy="396" r="3"/><circle cx="410" cy="462" r="3.5"/><circle cx="470" cy="250" r="2.5"/><circle cx="430" cy="380" r="2"/><circle cx="344" cy="486" r="2.5"/><circle cx="300" cy="452" r="2"/><circle cx="486" cy="470" r="2"/></g>
    <!-- ışıltılar -->
    <g transform="translate(256 262) rotate(-38)"><use href="#ice" filter="url(#glowIce)" opacity="0.8"/></g>
    <g transform="translate(256 262) rotate(38)"><use href="#blackfyre" filter="url(#glowFire)" opacity="0.8"/></g>
    <!-- çapraz kılıçlar -->
    <g transform="translate(256 262) rotate(38)"><use href="#blackfyre"/></g>
    <g transform="translate(256 262) rotate(-38)"><use href="#ice"/></g>
  </g>
</svg>
